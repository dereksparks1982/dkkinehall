name: Assemble the actual DK Kinehall web player as a desktop executable
on:
  push:
    paths:
      - .github/workflows/kinehall-exact-desktop.yml

permissions:
  contents: write

concurrency:
  group: kinehall-exact-desktop
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepare build-machine tools (not needed by player users)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            golang-go xvfb xauth libnss3 libasound2t64 libgbm1 libgtk-3-0t64
          node --version
          go version

      - name: Obtain current stable Chromium-based Electron runtime
        run: |
          mkdir -p "$RUNNER_TEMP/kinehall-npm"
          npm install --prefix "$RUNNER_TEMP/kinehall-npm" --no-audit --no-fund \
            --no-save electron@45.4.1

      - name: Package the ORIGINAL web player unchanged
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kinehall-runtime/resources/app"
          cp -a "$RUNNER_TEMP/kinehall-npm/node_modules/electron/dist/." \
            "$RUNNER_TEMP/kinehall-runtime/"
          cp standalone/main.cjs "$RUNNER_TEMP/kinehall-runtime/resources/app/main.cjs"
          cp standalone/package.json "$RUNNER_TEMP/kinehall-runtime/resources/app/package.json"
          cp -a docs "$RUNNER_TEMP/kinehall-runtime/resources/app/docs"
          chmod +x "$RUNNER_TEMP/kinehall-runtime/electron"
          test -f "$RUNNER_TEMP/kinehall-runtime/resources/app/docs/player.css"
          test -f "$RUNNER_TEMP/kinehall-runtime/resources/app/docs/player.js"
          test -f "$RUNNER_TEMP/kinehall-runtime/resources/app/docs/index.html"

      - name: Verify the real page and stylesheet in a desktop window
        run: |
          set -euo pipefail
          DK_KINEHALL_SMOKE=1 timeout 55s xvfb-run -a -s '-screen 0 1600x1000x24' \
            "$RUNNER_TEMP/kinehall-runtime/electron" --no-sandbox --disable-gpu

      - name: Bundle the runtime in GitHub-safe parts with a native executable
        run: |
          set -euo pipefail
          mkdir -p _internal
          tar -h -czf "$RUNNER_TEMP/kinehall-runtime.tar.gz" \
            -C "$RUNNER_TEMP/kinehall-runtime" .
          id="$(sha256sum "$RUNNER_TEMP/kinehall-runtime.tar.gz" | cut -d' ' -f1)"
          split -b 70M -d -a 3 "$RUNNER_TEMP/kinehall-runtime.tar.gz" \
            _internal/runtime.tar.gz.
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -ldflags="-s -w -X main.bundleID=$id" \
            -o 'DK Kinehall' standalone/launcher.go
          chmod +x 'DK Kinehall'
          test -x 'DK Kinehall'
          test -f _internal/runtime.tar.gz.000
          if find _internal -type f -size +95M -print -quit | grep -q .; then
            echo 'A bundled runtime part is too large for GitHub.'
            exit 1
          fi

      - name: Publish ONLY the root executable and its bundled runtime
        run: |
          set -euo pipefail
          git config user.name 'DK Kinehall build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f 'DK Kinehall' _internal
          if git diff --cached --quiet; then
            echo 'No updated executable to publish.'
            exit 1
          fi
          git commit -m 'Publish actual web-based Kinehall portable executable [skip ci]'
          git push origin HEAD:main
