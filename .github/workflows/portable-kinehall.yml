name: Build portable DK Kinehall (one time)
on:
  push:
    paths:
      - .github/workflows/portable-kinehall.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kinehall-portable-release
  cancel-in-progress: false

jobs:
  portable-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install build-machine tools (not required by end users)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-venv python3-tk python3-dev libvlc5 vlc-plugin-base \
            vlc-plugin-access-extra vlc-plugin-video-output

      - name: Prepare isolated build tools
        run: |
          /usr/bin/python3 -m venv .kinehall-build-env
          . .kinehall-build-env/bin/activate
          python -m pip install --disable-pip-version-check \
            pyinstaller python-vlc pillow tkinterdnd2

      - name: Build complete native executable directory
        run: |
          . .kinehall-build-env/bin/activate
          bash tools/build-portable-linux.sh

      - name: Publish one-folder executable into repository main
        run: |
          mkdir -p portable
          rm -rf 'portable/DK Kinehall'
          cp -a 'dist/DK Kinehall' 'portable/DK Kinehall'
          if find 'portable/DK Kinehall' -type f -size +95M -print -quit | grep -q .; then
            echo "::error::One bundled file exceeds GitHub's individual file size limit"
            exit 1
          fi
          git config user.name "DK Kinehall build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f portable
          if git diff --cached --quiet; then
            echo "The portable release has not changed."
            exit 0
          fi
          git commit -m "Add portable Linux executable with bundled VLC runtime [skip ci]"
          git push origin HEAD:main
