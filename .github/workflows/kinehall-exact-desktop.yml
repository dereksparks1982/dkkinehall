name: Assemble the exact DK Kinehall web player as a standalone executable
on:
  push:
    paths:
      - .github/workflows/kinehall-exact-desktop.yml

permissions:
  contents: write

concurrency:
  group: kinehall-exact-desktop
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepare build-machine utilities
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            golang-go xvfb xauth unzip libnss3 libasound2t64 libgbm1 libgtk-3-0t64

      - name: Download and verify official Electron for Linux
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 \
            https://github.com/electron/electron/releases/download/v45.4.1/electron-v45.4.1-linux-x64.zip \
            -o "$RUNNER_TEMP/electron.zip"
          curl -fL --retry 3 --retry-delay 3 \
            https://github.com/electron/electron/releases/download/v45.4.1/SHASUMS256.txt \
            -o "$RUNNER_TEMP/electron-checksums.txt"
          expected="$(awk '$2=="electron-v45.4.1-linux-x64.zip" {print $1}' "$RUNNER_TEMP/electron-checksums.txt")"
          test -n "$expected"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/electron.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/kinehall-runtime"
          unzip -q "$RUNNER_TEMP/electron.zip" -d "$RUNNER_TEMP/kinehall-runtime"
          test -x "$RUNNER_TEMP/kinehall-runtime/electron"

      - name: Add ORIGINAL web player unchanged
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kinehall-runtime/resources/app"
          cp standalone/main.cjs "$RUNNER_TEMP/kinehall-runtime/resources/app/main.cjs"
          cp standalone/package.json "$RUNNER_TEMP/kinehall-runtime/resources/app/package.json"
          cp -a docs "$RUNNER_TEMP/kinehall-runtime/resources/app/docs"
          test -f "$RUNNER_TEMP/kinehall-runtime/resources/app/docs/index.html"
          test -f "$RUNNER_TEMP/kinehall-runtime/resources/app/docs/player.css"
          test -f "$RUNNER_TEMP/kinehall-runtime/resources/app/docs/player.js"

      - name: Open actual player under a virtual desktop
        run: |
          set -euo pipefail
          DK_KINEHALL_SMOKE=1 timeout 55s xvfb-run -a -s '-screen 0 1600x1000x24' \
            "$RUNNER_TEMP/kinehall-runtime/electron" --no-sandbox --disable-gpu

      - name: Compress runtime and compile repository-root executable
        run: |
          set -euo pipefail
          mkdir -p _internal
          tar -h -czf "$RUNNER_TEMP/kinehall-runtime.tar.gz" \
            -C "$RUNNER_TEMP/kinehall-runtime" .
          id="$(sha256sum "$RUNNER_TEMP/kinehall-runtime.tar.gz" | cut -d' ' -f1)"
          split -b 70M -d -a 3 "$RUNNER_TEMP/kinehall-runtime.tar.gz" \
            _internal/runtime.tar.gz.
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -ldflags="-s -w -X main.bundleID=$id" \
            -o 'DK Kinehall' standalone/launcher.go
          chmod +x 'DK Kinehall'
          test -x 'DK Kinehall'
          test -f _internal/runtime.tar.gz.000
          if find _internal -type f -size +95M -print -quit | grep -q .; then
            echo 'The runtime exceeds the GitHub per-file limit.'
            exit 1
          fi

      - name: Commit executable and complete bundled runtime to main
        run: |
          set -euo pipefail
          git config user.name 'DK Kinehall build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f 'DK Kinehall' _internal
          git diff --cached --quiet && { echo 'No release files were staged'; exit 1; }
          git commit -m 'Publish exact web Kinehall desktop executable [skip ci]'
          git push origin HEAD:main
