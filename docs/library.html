<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#350307">
<meta name="application-name" content="DK Kinehall">
<title>DK Kinehall | Library</title>
<link rel="manifest" href="./manifest.webmanifest?v=20261126-library1">
<link rel="icon" href="./icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="stylesheet" href="./player.css?v=20261127-app-palette2">
<link rel="stylesheet" href="./library-home.css?v=20261127-app-palette2">
<script defer src="./jellyfin-artwork.js?v=20261116-1"></script>
<script defer src="./episode-metadata.js?v=20261126-golden-gun2"></script>
<script defer src="./library-store.js?v=20261126-trash-info1"></script>
<link rel="stylesheet" href="./live-tv.css?v=20261127-catalog">
<script defer src="./live-tv.js?v=20261127-catalog"></script>
<script defer src="./library-collections.js?v=20261127-collections"></script>
<script defer src="./library-home.js?v=20261127-collections"></script>
<script defer src="./i18n.js?v=20261126-live-tv3"></script>
</head>
<body>
<div class="shell library-shell">
  <header class="topbar">
    <a class="brand" href="./library.html" aria-label="DK Kinehall Library">
      <img class="brandmark" src="./icons/dk-media-player-128.png" width="45" height="45" alt="" decoding="async">
      <span class="brandname">DK KINEHALL</span>
    </a>
    <div class="header-tools library-tools">
      <button type="button" class="btn ghost" id="addLibraryFolder">Add Folder</button>
      <button type="button" class="btn primary" id="scanLibrary">Scan Library</button>
      <button type="button" class="btn primary" id="libraryEmptyTrash" hidden>Empty Trash</button>
      <label for="languageSelect" class="visually-hidden">Interface language</label>
      <select id="languageSelect" class="language-select" aria-label="Interface language"><option value="en">English</option><option value="ru">Русский</option></select>
    </div>
  </header>
  <main>
    <nav class="library-tabs" role="tablist" aria-label="Media collection">
      <button id="tabMovies" type="button" role="tab" aria-selected="true" aria-controls="libraryCollection">Movies</button>
      <button id="tabTV" type="button" role="tab" aria-selected="false" aria-controls="libraryCollection">TV Shows</button>
    </nav>
    <div id="libraryStatus" class="library-status" role="status" aria-live="polite">Loading saved library…</div>
    <section id="continueSection" class="library-section" aria-label="Continue Watching">
      <div class="section-heading"><h2>Continue Watching</h2></div>
      <div id="continueWatching" class="library-continue" aria-live="polite"></div>
    </section>
    <section class="library-section" aria-label="Entire Collection">
      <div class="section-heading">
        <div><h2 id="collectionTitle">Your Entire Movie Collection</h2><p id="collectionCount"></p></div>
      </div>
      <div id="seriesDetail" class="library-series-detail" hidden>
        <button type="button" class="btn ghost" id="backToSeries">Back to TV Shows</button>
        <h2 id="seriesTitle"></h2>
        <div class="library-season-row"><label for="seasonSelect">Season</label><select id="seasonSelect" class="select"></select></div>
      </div>
      <div id="libraryCollection" class="library-posters" role="tabpanel" aria-live="polite"></div>
      <button type="button" id="loadMoreLibrary" class="btn ghost library-load-more" hidden>Show More</button>
      <div id="emptyLibrary" class="library-empty panel" hidden>
        <img src="./images/golden-emblem.png" alt="" width="156" height="88" decoding="async">
        <h3>No local movies or TV shows yet</h3>
        <p>Add your movie or television folder to start your collection. Files stay on your device.</p>
        <button type="button" class="btn primary" id="addFirstFolder">Add Folder</button>
      </div>
    </section>
    <div class="library-footer-status" id="folderSummary" aria-live="polite"></div>
  </main>
  <div id="libraryContextMenu" class="library-context-menu" role="menu" hidden>
    <button type="button" role="menuitem" id="watchlistAction" hidden>Add to Watchlist</button>
    <button type="button" role="menuitem" id="manageMovieCollection" hidden>Manage Collections</button>
    <button type="button" role="menuitem" id="manageMovieEdition" hidden>Movie Editions</button>
    <button type="button" role="menuitem" id="movieDetailsAction" hidden>Movie Details</button>
    <button type="button" role="menuitem" id="refreshMovieMetadata" hidden>Refresh Metadata</button>
    <button type="button" role="menuitem" id="removeContinueWatching" hidden>Remove from Continue Watching</button>
    <button type="button" role="menuitem" id="removeFromLibrary" hidden>Remove from Library</button>
    <button type="button" role="menuitem" id="showInFolder" hidden>Show in folder</button>
    <button type="button" role="menuitem" id="deleteFromDisk">Delete from Disk…</button>
  </div>
</div>
<dialog id="movieDetailsDialog" class="dk-movie-details"><button type="button" class="dk-movie-details-close" id="movieDetailsClose" aria-label="Close">×</button><h2 id="movieDetailsTitle"></h2><p id="movieDetailsDescription"></p><dl id="movieDetailsFields"></dl><section id="movieFileSection" hidden><h3 id="movieFileHeading">File Information</h3><dl id="movieFileFields"></dl><p id="movieFileStatus" class="helper" role="status"></p></section></dialog>
<input type="file" id="libraryFolderFallback" webkitdirectory multiple hidden aria-label="Select a media folder">
</body>
</html>
