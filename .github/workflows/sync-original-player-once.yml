name: DK Kinehall original Chromium runtime sync (one-time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-original-player-once.yml

permissions:
  contents: write

jobs:
  sync-original-player:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the original DK Kinehall repository
        uses: actions/checkout@v4
      - name: Verify the web player and embedded subtitle decoders
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/player.js
          node --check docs/mkv-subtitles.js
          node --check docs/pgs-subtitles.js
          node --check docs/vobsub.js
          node docs/tests/embedded-subtitle-menu.cjs
          node docs/tests/mkv-tracks.cjs
          node docs/tests/mkv-subtitles.cjs
          node docs/tests/pgs-subtitles.cjs
          node docs/tests/vobsub.cjs
      - name: Synchronize original Chromium runtime with the same web interface
        shell: bash
        run: |
          set -euo pipefail
          python3 maintenance/sync_original_runtime.py .
          test -x 'DK Kinehall'
          test -s '_internal/runtime.tar.gz.000'
          test -s '_internal/runtime.tar.gz.001'
          test ! -e standalone
      - name: Commit updated executable cache ID and embedded Chromium resources to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DK Kinehall Runtime Sync'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- 'DK Kinehall' '_internal'
          if git diff --cached --quiet; then
            echo 'ERROR: Runtime archive was not updated'
            exit 1
          fi
          git diff --cached --stat
          git commit -m 'Sync existing DK Kinehall Chromium desktop runtime with embedded subtitle updates'
          git push origin HEAD:main
