name: One-time DK Kinehall native Linux executable
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dk-kinehall-native-once.yml

permissions:
  contents: write

jobs:
  native-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out existing DK Kinehall
        uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake g++ gcc pkg-config qt6-base-dev qt6-base-dev-tools libqt6opengl6-dev libmpv-dev libgl1-mesa-dev xvfb xauth file
      - name: Compile the existing native player
        shell: bash
        run: |
          set -o pipefail
          cmake -S native -B build-native -DCMAKE_BUILD_TYPE=Release 2>&1 | tee native/ci-configure.log
          cmake --build build-native --parallel 2 2>&1 | tee native/ci-compile.log
          test -x 'build-native/DK Kinehall'
          file 'build-native/DK Kinehall'
      - name: Try native window startup without browser
        shell: bash
        run: |
          set +e
          timeout 8 xvfb-run -a -s '-screen 0 1366x768x24' env LIBGL_ALWAYS_SOFTWARE=1 'build-native/DK Kinehall' > native/ci-smoke.log 2>&1
          exitcode=$?
          cat native/ci-smoke.log
          if [ "$exitcode" = 124 ] || [ "$exitcode" = 0 ]; then exit 0; fi
          echo "Native DK Kinehall exited abnormally: $exitcode"
          exit 1
      - name: Package Qt/libmpv executable and runtime
        shell: bash
        run: |
          bash native/package-portable.sh 'build-native/DK Kinehall'
          test -s dist/DK-Kinehall-native-linux-x86_64.tar.gz
      - name: Upload downloadable native Linux package
        uses: actions/upload-artifact@v4
        with:
          name: DK-Kinehall-native-linux-x86_64
          path: dist/DK-Kinehall-native-linux-x86_64.tar.gz
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Record result and run link for maintainer
        if: always()
        env:
          DK_JOB_RESULT: ${{ job.status }}
          DK_RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "# Native executable build"
            echo "Result: $DK_JOB_RESULT"
            echo "Run: https://github.com/dereksparks1982/dkkinehall/actions/runs/$DK_RUN_ID"
            echo "Archive: DK-Kinehall-native-linux-x86_64"
            echo "Date: 2026-11-25"
          } > native/BUILD_STATUS.md
          tail -60 native/ci-configure.log >> native/BUILD_STATUS.md 2>/dev/null || true
          tail -90 native/ci-compile.log >> native/BUILD_STATUS.md 2>/dev/null || true
          tail -40 native/ci-smoke.log >> native/BUILD_STATUS.md 2>/dev/null || true
          git config user.name 'DK Native Build'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add native/BUILD_STATUS.md
          git commit -m "Record DK Kinehall native build result $DK_RUN_ID $DK_JOB_RESULT" || true
          git push || true
