name: Build and verify Kinehall fullscreen executable (diagnostics)
on:
  push:
    paths:
      - .github/workflows/kinehall-fullscreen-fix.yml

permissions:
  contents: write

concurrency:
  group: kinehall-fullscreen-fix
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepare build machine and X11 window manager
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            golang-go xvfb xauth openbox unzip libnss3 libasound2t64 libgbm1 libgtk-3-0t64

      - name: Download verified Chromium-Electron runtime
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 3 \
            https://github.com/electron/electron/releases/download/v45.4.1/electron-v45.4.1-linux-x64.zip \
            -o "$RUNNER_TEMP/electron.zip"
          curl -fL --retry 3 --retry-delay 3 \
            https://github.com/electron/electron/releases/download/v45.4.1/SHASUMS256.txt \
            -o "$RUNNER_TEMP/electron-checksums.txt"
          expected="$(grep -F 'electron-v45.4.1-linux-x64.zip' "$RUNNER_TEMP/electron-checksums.txt" | head -n1 | cut -c1-64)"
          test -n "$expected"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/electron.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/kinehall-runtime"
          unzip -q "$RUNNER_TEMP/electron.zip" -d "$RUNNER_TEMP/kinehall-runtime"
          test -x "$RUNNER_TEMP/kinehall-runtime/electron"

      - name: Bundle identical web player and native fullscreen bridge
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/kinehall-runtime/resources/app"
          mkdir -p "$app"
          cp standalone/main.cjs standalone/preload.cjs standalone/package.json "$app/"
          cp -a docs "$app/docs"
          test -s "$app/docs/index.html"
          test -s "$app/docs/player.js"
          test -s "$app/docs/player.css"
          test -s "$app/preload.cjs"

      - name: Test fullscreen button, double-click and Escape in native window
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1600x1000x24' bash -c \
            'openbox --sm-disable >/dev/null 2>&1 & sleep 2; DK_KINEHALL_SMOKE=1 timeout 65s "$1" --no-sandbox --disable-gpu' \
            _ "$RUNNER_TEMP/kinehall-runtime/electron"

      - name: Build root executable and bundle runtime offline
        run: |
          set -euo pipefail
          rm -rf _internal
          mkdir _internal
          tar -h -czf "$RUNNER_TEMP/kinehall-runtime.tar.gz" \
            -C "$RUNNER_TEMP/kinehall-runtime" .
          id="$(sha256sum "$RUNNER_TEMP/kinehall-runtime.tar.gz" | cut -d' ' -f1)"
          split -b 70M -d -a 3 "$RUNNER_TEMP/kinehall-runtime.tar.gz" _internal/runtime.tar.gz.
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -ldflags="-s -w -X main.bundleID=$id" \
            -o 'DK Kinehall' standalone/launcher.go
          chmod +x 'DK Kinehall'
          test -x 'DK Kinehall'
          test -s _internal/runtime.tar.gz.000
          if find _internal -type f -size +95M -print -quit | grep -q .; then
            echo 'Runtime part exceeds GitHub file limit'
            exit 1
          fi

      - name: Test FINAL root executable after first-run extraction
        run: |
          set -euo pipefail
          rm -rf "$HOME/.cache/dk-kinehall"
          xvfb-run -a -s '-screen 0 1600x1000x24' bash -c \
            'openbox --sm-disable >/dev/null 2>&1 & sleep 2; DK_KINEHALL_SMOKE=1 timeout 100s "$1" --disable-gpu' \
            _ './DK Kinehall'

      - name: Publish verified root executable on main
        run: |
          set -euo pipefail
          git config user.name 'DK Kinehall build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f 'DK Kinehall' _internal
          git diff --cached --quiet && { echo 'Nothing staged'; exit 1; }
          git commit -m 'Rebuild exact web player with verified native fullscreen [skip ci]'
          git push origin HEAD:main
