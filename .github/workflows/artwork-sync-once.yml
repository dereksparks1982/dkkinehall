name: One-time original DK Kinehall artwork update
# Retry after correcting the source syntax caught by validation.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/artwork-sync-once.yml

permissions:
  contents: write

jobs:
  update-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out original Chromium player
        uses: actions/checkout@v4
      - name: Test artwork providers and the existing Up Next interface
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/metadata-ui.js
          node --check docs/episode-metadata.js
          node --check docs/player.js
          node docs/tests/episode-metadata.cjs
          node docs/tests/metadata-ui.cjs
          node docs/tests/poster-fallback.cjs
          node docs/tests/queue-artwork.cjs
          node docs/tests/web-player-smoke.cjs
      - name: Synchronize the original bundled Chromium player
        shell: bash
        run: |
          set -euo pipefail
          python3 maintenance/sync_original_runtime.py .
          test -x 'DK Kinehall'
          test -s '_internal/runtime.tar.gz.000'
          test -s '_internal/runtime.tar.gz.001'
          test ! -e standalone
      - name: Commit the existing executable and updated embedded artwork code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DK Kinehall Runtime Sync'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- 'DK Kinehall' '_internal'
          if git diff --cached --quiet; then
            echo "No updated runtime detected"
            exit 1
          fi
          git commit -m 'Sync original DK Kinehall Chromium runtime with repaired Up Next posters and episode artwork'
          git push origin HEAD:main
